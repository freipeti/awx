---
- name: Windows Update es CSV riport
  hosts: all
  gather_facts: false

  vars:
    report_path: '\\freidc.frei.local\netlogon\reports'
    report_file: "winupdate_{{ lookup('pipe', 'date +%F') }}.csv"

  tasks:

    - name: Windows frissitesek telepitese
      ansible.windows.win_updates:
        category_names:
          - SecurityUpdates
          - CriticalUpdates
        reboot: true
      register: update_result

    - name: CSV fejlec, ha meg nincs file
      ansible.windows.win_shell: |
        $file = "{{ report_path }}\{{ report_file }}"
        if (!(Test-Path $file)) {
          "Hostname;InstalledUpdates;RebootRequired" | Out-File -FilePath $file -Encoding UTF8
        }

    - name: CSV sor hozzaadasa
      ansible.windows.win_shell: |
        $file = "{{ report_path }}\{{ report_file }}"
        $line = "{{ inventory_hostname }};{{ update_result.installed_update_count | default(0) }};{{ update_result.reboot_required | default(false) }}"
        Add-Content -Path $file -Value $line
